name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build and pack the release
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: icumbi-release
          path: icumbi-release.tgz
          retention-days: 7

  # Releases the build made above to both web servers, one after the other, so
  # the site stays up. Runs only on main, and only once the repository variable
  # DEPLOY_ENABLED is set to "true" (after the servers are set up).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      WEB01_HOST: ${{ secrets.WEB01_HOST }}
      WEB02_HOST: ${{ secrets.WEB02_HOST }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: icumbi-release
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Known host keys are pinned; host key checking stays on.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Release to web-01, then web-02
        # A failure on the first server stops the job, so the second keeps the old release.
        run: |
          for host in "$WEB01_HOST" "$WEB02_HOST"; do
            scp -i ~/.ssh/deploy_key icumbi-release.tgz deploy/release.sh "$DEPLOY_USER@$host:/tmp/"
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$host" \
              'sudo bash /tmp/release.sh /tmp/icumbi-release.tgz; status=$?; rm -f /tmp/icumbi-release.tgz /tmp/release.sh; exit $status'
            # Give the load balancer time to see this server healthy again
            # before the other one is restarted.
            sleep 15
          done
      - name: Check that both servers answer
        run: deploy/check-balance.sh "$SITE_URL/api/health" 10
