# nginx site for icumbi. SITE_HOST is filled in by deploy/setup-web.sh. The server's default site is left untouched.
server {
    listen 80;
    server_name SITE_HOST;

    # Say which web server answered, so the load balancing can be seen
    # (deploy/check-balance.sh reads this header).
    add_header X-Served-By $hostname always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
