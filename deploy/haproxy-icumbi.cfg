# Lines to ADD to /etc/haproxy/haproxy.cfg on lb-01. Nothing else in the file changes.
# Replace <web-01-ip> and <web-02-ip> with the web servers' addresses.

# --- 1. In "frontend https_front": replace the bind line (the existing certificate stays first).
    bind *:443 ssl crt /etc/haproxy/certs/www.ndungutsecharles.tech.pem crt /etc/haproxy/certs/icumbi.ndungutsecharles.tech.pem

# --- 2. In the same frontend, AFTER "http-request set-header X-Forwarded-Proto https"
#        and BEFORE "default_backend web_servers", add:
    acl host_icumbi hdr(host) -i icumbi.ndungutsecharles.tech
    use_backend icumbi_servers if host_icumbi

# --- 3. At the end of the file, add a new backend:
backend icumbi_servers
    mode http
    balance roundrobin
    option forwardfor
    # While one server restarts during a release, nginx there answers 502:
    # send such a request to the other server instead.
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response 502
    # Health check through nginx to the app. A failing server gets no traffic.
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ icumbi.ndungutsecharles.tech
    server web-01 <web-01-ip>:80 check
    server web-02 <web-02-ip>:80 check
